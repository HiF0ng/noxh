<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col">

<div class="max-w-5xl mx-auto px-6 md:px-12 flex flex-col">

<ol class="inline-flex items-center gap-xs">
<li class="inline-flex items-center"><a class="hover:text-primary transition-colors" href="homepage.html">Trang chủ</a></li>
<li><div class="flex items-center"><span class="material-symbols-outlined text-[16px] md:text-[18px] lg:text-[22px] mx-1">chevron_right</span><span class="text-on-surface font-medium truncate max-w-[200px] md:max-w-none">Dự án</span></div></li>
</ol>
</nav>
<h1 class="font-headline-lg font-bold text-[18px] min-[360px]:text-[20px] sm:text-headline-lg-mobile md:text-headline-lg text-on-surface mb-sm tracking-tight text-balance whitespace-nowrap overflow-hidden text-ellipsis max-w-full">Danh sách dự án nhà ở xã hội</h1>
<p class="font-body-md text-[13px] md:text-body-md text-on-surface-variant max-w-2xl text-balance">
                Khám phá các Dự án Nhà ở xã hội đang và sắp triển khai.
            </p>
</div>
</section>
<!-- Main Content Container -->
<div class="flex-1 max-w-5xl mx-auto w-full px-6 md:px-12 pt-xs pb-lg flex flex-col lg:flex-row gap-gutter relative">
<!-- Filter Sidebar -->
<aside class="w-full lg:w-64 flex-shrink-0">
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-3 md:p-md flex flex-col gap-2 md:gap-sm sticky top-[100px]">
<h2 class="font-label-md text-label-md text-on-surface flex items-center gap-xs">
<span class="material-symbols-outlined text-[20px]">tune</span>
                    Bộ lọc Tìm kiếm
                </h2>
<!-- Search -->
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
<input id="project-search-input" class="w-full pl-10 pr-3 py-1.5 md:py-2 bg-surface rounded-lg border border-outline-variant focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface outline-none transition-shadow" placeholder="Tên dự án, chủ đầu tư, địa chỉ..." type="search" autocomplete="off" aria-label="Tìm theo tên dự án, chủ đầu tư hoặc địa chỉ">
</div>
<!-- Tỉnh/Thành -->
<div class="flex flex-col gap-1 md:gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant">Tỉnh/Thành phố</label>
<div class="relative location-dropdown">
<input class="w-full px-3 py-1.5 md:py-2 bg-surface rounded-lg border border-outline-variant focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface outline-none transition-shadow cursor-pointer select-none" id="province-input" readonly="" placeholder="Tất cả" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none transition-transform duration-200" id="province-arrow">expand_more</span>
<div class="absolute left-0 right-0 mt-2 bg-surface-container-lowest rounded-lg shadow-lg border border-outline-variant/30 hidden flex-col z-50 max-h-60 overflow-y-auto" id="province-list-panel">
<div class="p-2 border-b border-outline-variant/30 sticky top-0 bg-surface-container-lowest z-10">
<input class="w-full px-3 py-2 rounded border border-outline-variant bg-surface-container-low text-sm focus:border-primary focus:outline-none" id="province-search" placeholder="Gõ Tìm kiếm..." type="text"/>
</div>
<div class="flex flex-col py-1" id="province-options">
</div>
</div>
</div>
</div>
<!-- Quận/Huyện -->
<div class="flex flex-col gap-1 md:gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant">Quận/Huyện</label>
<div class="relative location-dropdown opacity-50" id="district-dropdown-container">
<input class="w-full px-3 py-1.5 md:py-2 bg-surface rounded-lg border border-outline-variant focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface outline-none transition-shadow cursor-pointer select-none" id="district-input" readonly="" disabled="" placeholder="Tất cả" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none transition-transform duration-200" id="district-arrow">expand_more</span>
<div class="absolute left-0 right-0 mt-2 bg-surface-container-lowest rounded-lg shadow-lg border border-outline-variant/30 hidden flex-col z-50 max-h-60 overflow-y-auto" id="district-list-panel">
<div class="p-2 border-b border-outline-variant/30 sticky top-0 bg-surface-container-lowest z-10">
<input class="w-full px-3 py-2 rounded border border-outline-variant bg-surface-container-low text-sm focus:border-primary focus:outline-none" id="district-search" placeholder="Gõ Tìm kiếm..." type="text"/>
</div>
<div class="flex flex-col py-1" id="district-options">
</div>
</div>
</div>
</div>
<!-- Trạng thái -->
<div class="flex flex-col gap-1 md:gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant">Trạng thái Dự án</label>
<select id="sidebar-status-filter" class="w-full px-3 py-1.5 md:py-2 bg-surface-container-lowest rounded-lg border border-outline-variant focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-[13px] md:text-body-md text-on-surface outline-none transition-shadow appearance-none">
<option value="all">Tất cả</option>
<option value="Chờ xây dựng">Chờ xây dựng</option>
<option value="Đang xây dựng">Đang xây dựng</option>
<option value="Sắp nhận hồ sơ">Sắp nhận hồ sơ</option>
<option value="Đang nhận hồ sơ">Đang nhận hồ sơ</option>
<option value="Bàn giao">Bàn giao</option>
</select>
</div>
<!-- Mức giá -->
<div class="flex flex-col gap-1 md:gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant">Khoảng giá</label>
<select id="sidebar-price-filter" class="w-full px-3 py-1.5 md:py-2 bg-surface rounded-lg border border-outline-variant focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface outline-none transition-shadow appearance-none">
<option value="all">Tất cả</option>
<option value="under-15">Dưới 15 triệu/m²</option>
<option value="15-20">15 - 20 triệu/m²</option>
<option value="over-20">Trên 20 triệu/m²</option>
</select>
</div>
<button id="project-filter-reset" type="button" class="w-full mt-1 px-4 py-2.5 rounded-lg border border-primary text-primary font-semibold text-sm hover:bg-primary hover:text-on-primary focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">restart_alt</span>
Đặt lại bộ lọc
</button>
</div>
</aside>
<!-- Project Grid Area -->
<section class="flex-1 flex flex-col gap-sm">
<!-- Grid Header -->
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-sm">
<span id="project-counter-text" class="font-body-md text-body-md text-on-surface-variant">
                    Hiển thị <strong id="visible-count-text" class="text-on-surface">1 - 6</strong> trong số <strong id="total-count-text" class="text-on-surface">6</strong> Dự án
                </span>
<div class="flex items-center gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant whitespace-nowrap">Bộ lọc:</label>
<select id="project-filter-sort-select" class="pl-3 pr-8 py-1.5 bg-surface-container-lowest rounded-lg border border-outline-variant focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface outline-none cursor-pointer">
<option value="latest">Mới nhất</option>
<option value="price-asc">Giá thấp đến cao</option>
<option value="price-desc">Giá cao đến thấp</option>
</select>
</div>
</div>

    <!-- Skeleton 1 -->

        <div class="skeleton-shimmer h-4 w-1/2 rounded-md"></div>

        <div class="skeleton-shimmer h-5 w-3/4 rounded-md"></div>
        <div class="skeleton-shimmer h-4 w-1/2 rounded-md"></div>
        <div class="skeleton-shimmer h-3 w-full rounded-md mt-2"></div>
        <div class="skeleton-shimmer h-8 w-full rounded-full mt-3"></div>
    </div>
    <!-- Skeleton 4 -->
    <div class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/60 shadow-sm space-y-3">
        <div class="skeleton-shimmer h-44 w-full rounded-lg"></div>
        <div class="skeleton-shimmer h-5 w-3/4 rounded-md"></div>
        <div class="skeleton-shimmer h-4 w-1/2 rounded-md"></div>
        <div class="skeleton-shimmer h-3 w-full rounded-md mt-2"></div>
        <div class="skeleton-shimmer h-8 w-full rounded-full mt-3"></div>
    </div>
    <!-- Skeleton 5 -->
    <div class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/60 shadow-sm space-y-3">
        <div class="skeleton-shimmer h-44 w-full rounded-lg"></div>
        <div class="skeleton-shimmer h-5 w-3/4 rounded-md"></div>
        <div class="skeleton-shimmer h-4 w-1/2 rounded-md"></div>
        <div class="skeleton-shimmer h-3 w-full rounded-md mt-2"></div>
        <div class="skeleton-shimmer h-8 w-full rounded-full mt-3"></div>
    </div>
    <!-- Skeleton 6 -->
    <div class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/60 shadow-sm space-y-3">
        <div class="skeleton-shimmer h-44 w-full rounded-lg"></div>
        <div class="skeleton-shimmer h-5 w-3/4 rounded-md"></div>
        <div class="skeleton-shimmer h-4 w-1/2 rounded-md"></div>
        <div class="skeleton-shimmer h-3 w-full rounded-md mt-2"></div>
        <div class="skeleton-shimmer h-8 w-full rounded-full mt-3"></div>
    </div>
</div>
<div id="project-filter-empty-state" class="hidden py-12 px-6 text-center bg-surface-container-low rounded-2xl border border-dashed border-outline-variant" role="status" aria-live="polite">
<span class="material-symbols-outlined text-4xl text-outline mb-2">search_off</span>
<h3 class="font-bold text-on-surface mb-1">Không tìm thấy dự án phù hợp</h3>
<p class="text-sm text-on-surface-variant">Hãy thử từ khóa hoặc điều kiện lọc khác.</p>
</div>
<nav id="projects-pagination" class="hidden flex flex-wrap items-center justify-center gap-2 pt-4" aria-label="Phân trang dự án"></nav>
</section>
</main>
