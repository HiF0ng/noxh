<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu - Hỗ trợ Nhà ở xã hội</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md text-on-surface bg-background">
    <div id="navbar-placeholder"></div>
    <main class="flex-grow flex items-start justify-center pt-[120px] md:pt-[136px] pb-xl px-6 md:px-12 relative overflow-hidden">
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-fixed-dim rounded-full mix-blend-multiply blur-3xl opacity-30"></div>
            <div class="absolute top-40 -left-20 w-72 h-72 bg-secondary-container rounded-full mix-blend-multiply blur-3xl opacity-20"></div>
        </div>
        <div class="w-full max-w-md z-10">
            <div class="glass-card rounded-xl p-md md:p-lg relative">
                <div class="text-center mb-md">
                    <div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mx-auto mb-sm">
                        <span class="material-symbols-outlined text-primary text-[32px]">key</span>
                    </div>
                    <h1 id="recovery-title" class="font-headline-md text-headline-md text-on-surface mb-xs">Khôi phục mật khẩu</h1>
                    <p id="recovery-description" class="font-body-md text-body-md text-on-surface-variant">Nhập email đã đăng ký để tiếp tục khôi phục mật khẩu.</p>
                </div>

                <p id="recovery-message" class="hidden mb-sm rounded-lg px-3 py-2 text-sm" role="alert"></p>

                <form id="recovery-email-form" class="space-y-sm">
                    <label class="block font-label-md text-label-md text-on-surface mb-base" for="recovery-email">Email</label>
                    <div class="relative"><span class="material-symbols-outlined absolute inset-y-0 left-0 pl-3 flex items-center text-outline-variant">mail</span><input id="recovery-email" class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="Nhập email của bạn" required type="email"></div>
                    <button class="w-full font-label-md text-label-md bg-primary text-on-primary rounded-full py-3 px-md hover:bg-primary-container transition-colors shadow-sm flex items-center justify-center gap-2 mt-md" type="submit"><span class="material-symbols-outlined text-[18px]">send</span>Gửi mã xác nhận</button>
                </form>

                <form id="recovery-code-form" class="space-y-sm hidden">
                    <label class="block font-label-md text-label-md text-on-surface mb-base" for="recovery-code">Mã xác thực gồm 6 chữ số</label>
                    <input id="recovery-code" class="block w-full px-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-center tracking-[0.5em] text-lg font-semibold text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="000000" type="text">
                    <button class="w-full font-label-md text-label-md bg-primary text-on-primary rounded-full py-3 px-md hover:bg-primary-container transition-colors shadow-sm mt-md" type="submit">Xác thực mã</button>
                </form>

                <form id="recovery-password-form" class="space-y-sm hidden">
                    <label class="block font-label-md text-label-md text-on-surface mb-base" for="recovery-new-password">Mật khẩu mới</label>
                    <input id="recovery-new-password" class="block w-full px-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" minlength="6" required type="password">
                    <label class="block font-label-md text-label-md text-on-surface mb-base" for="recovery-confirm-password">Xác nhận mật khẩu mới</label>
                    <input id="recovery-confirm-password" class="block w-full px-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" minlength="6" required type="password">
                    <button class="w-full font-label-md text-label-md bg-primary text-on-primary rounded-full py-3 px-md hover:bg-primary-container transition-colors shadow-sm mt-md" type="submit">Đổi mật khẩu</button>
                </form>

                <div id="recovery-success" class="hidden text-center py-sm"><span class="material-symbols-outlined text-primary text-4xl">check_circle</span><p class="font-semibold text-on-surface mt-3">Đổi mật khẩu thành công</p><p class="text-sm text-on-surface-variant mt-2">Bạn sẽ được chuyển đến trang đăng nhập sau <span id="recovery-countdown">5</span> giây.</p></div>
                <div class="mt-md text-center"><a class="inline-flex items-center gap-1 font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors" href="login.html"><span class="material-symbols-outlined text-[16px]">arrow_back</span>Quay lại đăng nhập</a></div>
            </div>
        </div>
    </main>
    <div id="footer-placeholder"></div>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-service.js?v=5"></script>
    <script src="assets/js/main.js?v=44"></script>
    <script src="assets/js/recover-password.js?v=2"></script>
</body>
</html>
