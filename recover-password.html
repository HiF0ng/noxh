<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Khôi phục mật khẩu - noxh.help</title><link rel="stylesheet" href="assets/css/style.css?v=26"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script src="assets/js/tailwind-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/icon-utilities.css"><style>
.recovery-form-transition{transition:opacity .24s ease,transform .24s ease}.recovery-collapse{opacity:0;transform:scale(.45);pointer-events:none}.otp-inputs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.55rem}.otp-cell{width:100%;min-width:0;height:3.55rem;border:1.5px solid #cbd5e1;border-radius:.7rem;background:#fff;color:#172033;font-size:1.35rem;font-weight:700;text-align:center;outline:none;transition:border-color .18s ease,box-shadow .18s ease}.otp-cell:focus{border-color:#2864ea;box-shadow:0 0 0 3px rgba(40,100,234,.14)}.otp-inputs.is-invalid{animation:recovery-shake .36s ease-in-out}.otp-inputs.is-invalid .otp-cell{border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.08)}.recovery-spinner{width:1.25rem;height:1.25rem;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:999px;animation:recovery-spin .7s linear infinite}@keyframes recovery-shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}@keyframes recovery-spin{to{transform:rotate(360deg)}}
</style></head>
<body class="min-h-screen flex flex-col font-body-md text-body-md text-on-surface bg-background"><div id="navbar-placeholder"></div><main class="flex-grow flex items-start justify-center pt-[120px] md:pt-[136px] pb-xl px-6 md:px-12 relative overflow-hidden"><div class="absolute inset-0 overflow-hidden pointer-events-none"><div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-fixed-dim rounded-full mix-blend-multiply blur-3xl opacity-30"></div></div><div class="w-full max-w-md z-10"><div class="glass-card rounded-xl p-md md:p-lg relative"><div id="recovery-heading" class="text-center mb-md"><div id="recovery-heading-icon" class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mx-auto mb-sm"><span class="material-symbols-outlined text-primary text-[32px]">key</span></div><h1 id="recovery-title" class="font-headline-md text-headline-md text-on-surface mb-xs">Khôi phục mật khẩu</h1><p id="recovery-description" class="font-body-md text-body-md text-on-surface-variant">Nhập email đã đăng ký để tiếp tục khôi phục mật khẩu.</p></div>
<p id="recovery-message" class="hidden mb-sm rounded-lg px-3 py-2 text-sm" role="alert"></p>
<form id="recovery-email-form" class="space-y-sm recovery-form-transition" novalidate><div class="relative"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[20px] leading-none text-outline-variant pointer-events-none">mail</span><input id="recovery-email" class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="Nhập email của bạn" required type="email"></div><button id="recovery-send-button" class="w-full font-label-md text-label-md bg-primary text-on-primary rounded-full py-3 px-md hover:bg-primary-container transition-colors shadow-sm flex items-center justify-center gap-2 mt-md disabled:opacity-70" type="submit"><span class="material-symbols-outlined text-[18px]">send</span><span>Gửi mã xác nhận</span></button></form>
<form id="recovery-code-form" class="space-y-sm hidden recovery-form-transition"><label class="block font-label-md text-label-md text-on-surface mb-base" for="recovery-code-1">Mã xác thực gồm 6 chữ số</label><div id="recovery-otp-inputs" class="otp-inputs"><input id="recovery-code-1" class="otp-cell" autocomplete="one-time-code" inputmode="numeric" maxlength="1"><input class="otp-cell" inputmode="numeric" maxlength="1"><input class="otp-cell" inputmode="numeric" maxlength="1"><input class="otp-cell" inputmode="numeric" maxlength="1"><input class="otp-cell" inputmode="numeric" maxlength="1"><input class="otp-cell" inputmode="numeric" maxlength="1"></div><button class="w-full font-label-md text-label-md bg-primary text-on-primary rounded-full py-3 px-md hover:bg-primary-container transition-colors shadow-sm mt-md" type="submit">Xác thực mã</button><button id="recovery-resend-button" class="block w-full mt-sm text-center text-sm font-semibold text-primary hover:underline disabled:cursor-not-allowed disabled:opacity-60" type="button">Gửi lại mã xác thực</button></form>
<form id="recovery-password-form" class="space-y-sm hidden recovery-form-transition"><label class="block font-label-md text-label-md text-on-surface mb-base" for="recovery-new-password">Nhập mật khẩu mới</label><div class="relative"><input id="recovery-new-password" class="block w-full px-3 py-2 pr-11 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" minlength="6" required type="password"><button class="password-visibility-toggle absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary" type="button" aria-label="Hiện mật khẩu"><span class="material-symbols-outlined">visibility_off</span></button></div><label class="block font-label-md text-label-md text-on-surface mb-base" for="recovery-confirm-password">Nhập lại mật khẩu mới</label><div class="relative"><input id="recovery-confirm-password" class="block w-full px-3 py-2 pr-11 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" minlength="6" required type="password"><button class="password-visibility-toggle absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary" type="button" aria-label="Hiện mật khẩu"><span class="material-symbols-outlined">visibility_off</span></button></div><button class="w-full font-label-md text-label-md bg-primary text-on-primary rounded-full py-3 px-md hover:bg-primary-container transition-colors shadow-sm mt-md" type="submit">Đổi mật khẩu</button></form>
<div id="recovery-success" class="hidden text-center py-lg" aria-live="polite"></div><div id="recovery-back-link" class="mt-md text-center"><a class="inline-flex items-center gap-1 font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors" href="login.html"><span class="material-symbols-outlined text-[16px]">arrow_back</span>Quay lại đăng nhập</a></div></div></div></main><div id="footer-placeholder"></div><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-service.js?v=16"></script><script src="assets/js/main.js?v=66"></script><script src="assets/js/recover-password.js?v=9"></script></body></html>
