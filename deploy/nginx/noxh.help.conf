# Initial HTTP configuration for NOXH.help.
# Certbot adds the TLS server blocks after the certificate is issued.

server {
    listen 80;
    listen [::]:80;
    server_name www.noxh.help;
    return 301 https://noxh.help$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name noxh.help;

    root /var/www/noxh/current;
    index homepage.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Only the declared Vietnamese public routes receive their implementation
    # template. Unknown routes retain HTTP 404 and use the themed 404 page.
    location = / { return 302 /trang-chu; }
    location = /trang-chu { try_files /homepage.html =404; }
    location = /du-an { try_files /all-projects.html =404; }
    location = /tai-lieu { try_files /documents.html =404; }
    location = /cau-hoi-thuong-gap { try_files /faq.html =404; }
    location = /so-sanh { try_files /compare.html =404; }
    location = /tinh-khoan-vay { try_files /loan.html =404; }
    location = /lien-he { try_files /contact.html =404; }
    location = /ve-chung-toi { try_files /about_us.html =404; }
    location = /chinh-sach-bao-mat { try_files /policy.html =404; }
    location = /dieu-khoan-su-dung { try_files /term_of_use.html =404; }
    location = /huong-dan { try_files /guide.html =404; }

    # Published projects are pre-rendered at build time. A nonexistent slug
    # never falls back to a generic HTML shell with status 200.
    location ~ ^/du-an/[a-z0-9][a-z0-9-]*/?$ {
        try_files $uri/index.html =404;
    }

    # App shells remain accessible for the JavaScript authentication flow;
    # Supabase Auth/RLS protects data and these pages carry noindex metadata.
    location = /dang-nhap { try_files /login.html =404; }
    location = /dang-ky { try_files /signup.html =404; }
    location = /quen-mat-khau { try_files /recover-password.html =404; }
    location = /tai-khoan { try_files /settings.html =404; }
    location = /da-luu { try_files /saved.html =404; }
    location = /admin { try_files /admin.html =404; }
    location = /admin/dang-nhap { try_files /admin-login.html =404; }

    location = /robots.txt { try_files $uri =404; access_log off; }
    location = /sitemap.xml { try_files $uri =404; access_log off; }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|avif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* /\.(?!well-known/) { return 404; }
    location ~* \.(?:env|ini|log|sql|json|bak|zip|gz|pem|key|crt|php|asp|aspx|exe|dll|pdb)$ { return 404; }

    location / { try_files $uri $uri/ =404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
