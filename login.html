<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Đăng nhập - HousingSupportVN</title>
<link rel="stylesheet" href="assets/css/style.css?v=26">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/icon-utilities.css">
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopNavBar -->
<div id="navbar-placeholder"></div>
<!-- Main Content: Login Form -->
<main class="flex-grow flex flex-col items-center pt-[90px] md:pt-[140px] pb-lg px-8 md:px-12 bg-cityscape relative">
<a href="homepage.html" class="mb-6 z-10 drop-shadow-md md:hidden">
    <img src="img/logo.svg" alt="noxh.help" class="h-8 md:h-10 w-auto">
</a>
<div class="auth-login-card max-w-[800px] w-full bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] overflow-hidden flex flex-col md:flex-row h-fit z-10">
<!-- Left Side: Illustration -->
<div class="hidden md:block md:w-1/2 relative bg-surface-container">
<img class="w-full h-full object-cover absolute inset-0 z-0" alt="Media Placeholder" src="https://placehold.co/600x800/e2e8f0/64748b?text=Media+Placeholder">
<div class="absolute inset-0 bg-primary/10 z-10 mix-blend-multiply"></div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 p-6 flex flex-col justify-center">
<div class="mb-4">
<h1 class="font-headline-sm text-[22px] text-on-surface mb-1 font-bold">Chào mừng trở lại</h1>
<p class="font-body-sm text-[13px] md:text-[11px] text-on-surface-variant md:whitespace-nowrap">Vui lòng nhập thông tin tài khoản để đăng nhập</p>
</div>
<form class="space-y-3" id="login-form" novalidate>
<div>
<label class="block font-label-md text-[12px] text-on-surface font-bold mb-1" for="email">Email</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-1.5 font-body-sm text-[13px] text-on-surface-variant placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="email" placeholder="Nhập email đã đăng ký" required="" type="email">
<span class="hidden text-error text-[11px] mt-1 error-text" id="email-error">Bạn cần điền thông tin</span>
</div>
<div>
<div class="flex justify-between items-center mb-1">
<label class="block font-label-md text-[12px] text-on-surface font-bold" for="password">Mật khẩu</label>
<a class="font-label-md text-[12px] text-primary hover:text-primary-container hover:underline transition-colors" href="recover-password.html">Quên mật khẩu?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-outline">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-1.5 pl-9 pr-9 font-body-sm text-[13px] text-on-surface-variant placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors cursor-pointer flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[18px] leading-none">visibility_off</span>
</button>
</div>
<span class="hidden text-error text-[11px] mt-1 error-text" id="password-error">Bạn cần điền thông tin</span>
</div>
<div class="flex items-center mt-2">
<input class="w-3 h-3 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2" id="remember" type="checkbox">
<label class="ml-2 font-body-sm text-[12px] text-on-surface-variant" for="remember">Ghi nhớ đăng nhập</label>
</div>
<button class="w-full flex items-center justify-center bg-primary hover:bg-[#1c55cc] text-on-primary font-label-md text-label-sm py-2 rounded-full transition-all duration-200 shadow-[0_4px_20px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] cursor-pointer active:opacity-70 mt-3 relative min-h-[40px]" type="submit">
    <span class="btn-text">Đăng nhập</span>
</button>
</form>
<div class="mt-4 text-center space-y-2">
<p class="font-body-sm text-[12px] text-on-surface-variant">
                        Chưa có tài khoản? 
                        <a class="font-label-md text-[12px] text-primary hover:text-primary-container hover:underline transition-colors ml-1" href="signup.html">Đăng ký ngay</a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer -->
<div id="footer-placeholder"></div>
<script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-service.js?v=17"></script>
    <script src="assets/js/main.js?v=67"></script>
</body></html>
