<!DOCTYPE html><html lang="vi" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Đăng ký - HousingSupportVN</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind-config.js"></script>


</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopNavBar -->
<div id="navbar-placeholder"></div>
<!-- Main Content Canvas -->
<main class="flex-grow relative flex justify-center pt-[120px] pb-lg px-4 md:px-8 bg-cityscape">
<div class="w-full max-w-[360px] bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] border border-outline-variant overflow-hidden z-10 h-fit">
<div class="pt-5 px-5 text-center">
<h1 class="font-headline-sm text-[22px] text-on-surface mb-1 font-bold">Tạo tài khoản</h1>
<p class="font-body-sm text-[13px] text-on-surface-variant">Tạo tài khoản riêng của bạn hoàn toàn Miễn phí</p>
</div>
<form class="p-5 flex flex-col gap-3" id="signup-form">
<div class="flex flex-col gap-1">
<label class="font-label-md text-[12px] text-on-surface font-bold" for="fullname">Họ và tên</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-outline">person</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-DEFAULT py-1.5 pl-9 pr-3 font-body-sm text-[13px] text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="fullname" name="fullname" placeholder="Nhập Họ và tên của bạn" type="text">
</div>
</div>
<!-- Input: Email -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-[12px] text-on-surface font-bold" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-outline">mail</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-DEFAULT py-1.5 pl-9 pr-3 font-body-sm text-[13px] text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="email" name="email" placeholder="ví dụ: ten@email.com" type="email">
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-[12px] text-on-surface font-bold" for="phone">Số điện thoại</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-outline">call</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-DEFAULT py-1.5 pl-9 pr-3 font-body-sm text-[13px] text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="phone" name="phone" placeholder="Nhập số điện thoại" type="tel">
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-[12px] text-on-surface font-bold" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-outline">lock</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-DEFAULT py-1.5 pl-9 pr-3 font-body-sm text-[13px] text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="password" name="password" placeholder="Tạo mật khẩu" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors cursor-pointer flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[18px] leading-none">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-[12px] text-on-surface font-bold" for="confirm_password">Xác nhận mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-outline">lock_reset</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-DEFAULT py-1.5 pl-9 pr-9 text-body-sm text-[13px] text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors cursor-pointer flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[18px] leading-none">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-start gap-2 mt-1">
<input class="mt-0.5 rounded-[2px] border-outline-variant text-primary focus:ring-primary h-3.5 w-3.5" id="terms" type="checkbox">
<label class="font-label-sm text-[11px] text-on-surface-variant font-normal leading-relaxed" for="terms">
    Bằng việc đăng ký, bạn đồng ý với <a class="text-primary hover:underline" href="#">Điều khoản</a> và <a class="text-primary hover:underline" href="#">Chính sách bảo mật</a>.
</label>
</div>
<button class="w-full flex items-center justify-center mt-2 font-label-md text-label-sm bg-primary hover:bg-[#1c55cc] text-on-primary py-2 rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] transition-all duration-200 active:scale-[0.98] relative min-h-[40px]" type="submit">
    <span class="btn-text">Đăng ký</span>
</button>
<div class="text-center mt-2 border-t border-outline-variant pt-3">
<p class="font-body-sm text-[12px] text-on-surface-variant">
    Đã có tài khoản? <a class="font-label-md text-[12px] text-primary hover:underline" href="login.html">Đăng nhập</a>
</p>
</div>
</form>
</div>
</main>
<!-- Footer -->
<div id="footer-placeholder"></div>




<script src="assets/js/main.js"></script>
</body></html>
